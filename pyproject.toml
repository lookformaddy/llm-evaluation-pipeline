[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-evaluation-pipeline"
version = "1.0.0"
description = "CI-grade automated evaluation harness for LLM applications: versioned golden datasets, pluggable systems under test, lexical/semantic/judge scorers, groundedness checks, and regression gating."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "LLM Evaluation Pipeline contributors" }]
keywords = ["llm", "evaluation", "llmops", "ci", "regression-testing", "rag"]
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
llm-eval = "llm_eval_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_eval_pipeline = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
